services:
  - type: web
    name: linkedin-ai-manager
    env: node
    buildCommand: cd server && npm install && npm run build && cd ../client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /
      - key: PORT
        value: 10000
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: LINKEDIN_SCOPES
        value: openid profile email w_member_social
